# Generated from:
# https://github.com/plone/meta/tree/2.x/src/plone/meta/default
# See the inline comments on how to expand/tweak this configuration file
[meta]
template = "default"
commit-id = "2.11.2.dev0"

[tox]
test_matrix = {"6.3" = ["*"]}
# One test and coverage run over all four packages in src/plone/.
package_name = "plone"

[pyproject]
# requirements.txt is only the mxdev input of the PLIP 4137 transition, see mx.ini.
check_manifest_ignores = """
    "requirements.txt",
"""
# plone.app.portlets and plone.portlet.* are part of this distribution.
dependencies_ignores = "['zope.testing', 'Products.CMFPlone', 'plone.app.event', 'plone.app.vocabularies', 'plone.app.portlets', 'plone.portlet.collection', 'plone.portlet.static']"
dependencies_mappings = [
    "ExtensionClass = ['ComputedAttribute']",
    ]

[github]
# The merged distribution has known dependency cycles (plone.app.layout,
# plone.app.dexterity, plone.app.contentmenu, five.customerize all depend on
# plone.portlets).  They are resolved in step 2 of PLIP 4137; re-enable the
# "circular" job then.
jobs = [
    "qa",
    "coverage",
    "dependencies",
    "release_ready",
    ]
