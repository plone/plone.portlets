# Transition setup for PLIP https://github.com/plone/Products.CMFPlone/issues/4137
#
# Until the empty transitional releases of plone.app.portlets,
# plone.portlet.collection and plone.portlet.static are on PyPI (and pinned
# in the Plone constraints), the tests would pull the old code distributions
# from PyPI.  mxdev checks the empty packages out from their repositories
# instead and drops the old pins.  While the stub pull requests are open,
# stub_branch points to their branch; switch it to master when merging them.
# Remove this file and `use_mxdev` from
# .meta.toml once the empty packages are released.
[settings]
requirements-in = requirements.txt
main-package = -e .[test]
stubs = https://github.com/plone
stub_branch = plip-4137-stub
ignores =
    plone.portlets

[plone.app.portlets]
url = ${settings:stubs}/plone.app.portlets.git
branch = ${settings:stub_branch}

[plone.portlet.collection]
url = ${settings:stubs}/plone.portlet.collection.git
branch = ${settings:stub_branch}

[plone.portlet.static]
url = ${settings:stubs}/plone.portlet.static.git
branch = ${settings:stub_branch}
